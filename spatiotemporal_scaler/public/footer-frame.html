<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cf268321.cloudfree.jp/13jellies/asset/css/common.css">
  <link rel="stylesheet" href="https://cf268321.cloudfree.jp/13jellies/asset/css/footer.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div id="footer-root"></div>
  <script>
    (function () {
      const root = document.getElementById('footer-root');

      const postHeight = () => {
        const height = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight,
          320
        );

        if (window.parent !== window) {
          window.parent.postMessage({ type: 'footer-frame-height', height }, '*');
        }
      };

      // Try server-side proxy first (better charset/CORS handling when running dev/server).
      const tryProxy = () => fetch('./api/footer', { cache: 'no-store' });

      tryProxy()
        .then((response) => {
          if (!response.ok) throw new Error(`proxy failed: ${response.status}`);
          return response.text();
        })
        .catch(() => {
          // If proxy not available or failed, fall back to direct fetch of remote HTML.
          return fetch('https://cf268321.cloudfree.jp/13jellies/asset/html/footer.html', { cache: 'no-store' })
            .then((response) => {
              if (!response.ok) throw new Error(`direct fetch failed: ${response.status}`);
              return response.text();
            });
        })
        .then((html) => {
          const parsed = new DOMParser().parseFromString(html, 'text/html');
          root.innerHTML = parsed.body.innerHTML || html;
          requestAnimationFrame(() => {
            postHeight();
            requestAnimationFrame(postHeight);
          });
        })
        .catch((error) => {
          // Final fallback: cross-origin iframe showing remote footer (visual only).
          try {
            const iframe = document.createElement('iframe');
            iframe.src = 'https://cf268321.cloudfree.jp/13jellies/asset/html/footer.html';
            iframe.style.width = '100%';
            iframe.style.border = '0';
            iframe.style.minHeight = '320px';
            iframe.loading = 'lazy';
            root.innerHTML = '';
            root.appendChild(iframe);
          } catch (e) {
            root.innerHTML = `<footer>Footer unavailable: ${String(error && error.message ? error.message : error)}</footer>`;
          }
          postHeight();
        });

      window.addEventListener('load', postHeight);
      window.addEventListener('resize', postHeight);

      const observer = new ResizeObserver(postHeight);
      observer.observe(document.documentElement);
      observer.observe(document.body);
    })();
  </script>
</body>
</html>
